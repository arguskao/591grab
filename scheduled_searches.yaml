# 每週寄信搜尋設定
#
# 修改條件時只需要編輯這個檔案。同一組條件可在 districts 一次列出多個區域；
# 不同價位、房數或日期條件才需要另外新增一組 search。

timezone: "Asia/Taipei"
output_dir: "data/output/scheduled"

email:
  subject_prefix: "591 每週物件"
  preview_limit: 10

searches:
  - id: "tainan_east_rende_west_central_5plus"
    name: "台南市東區、仁德區、中西區｜600–1200 萬｜5 房以上"
    enabled: true
    region_id: 15
    city: "台南市"
    districts:
      - section_id: 206
        name: "東區"
      - section_id: 219
        name: "仁德區"
      - section_id: 208
        name: "中西區"
    price_min_wan: 600
    price_max_wan: 1200
    rooms_min: 5

    # 日期條件二擇一；目前使用最近 14 個台灣日曆日（包含執行日）。
    # posted_since: "2026-07-01"
    posted_within_days: 14

    # 防止 API 異常時無限翻頁；一般精確搜尋只會用到少數頁。
    max_pages: 20
